<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" role="img" aria-label="새로 여는 페이지는 Proxy가, 열려 있는 화면은 서버가 알려 준 남은 시간으로, 배포 전에 연 옛 화면은 API 401과 로그인 화면 새로 열기를 거쳐 모두 종료 화면으로 간다"><title>새로 여는 페이지는 Proxy가, 열려 있는 화면은 서버가 알려 준 남은 시간으로, 배포 전에 연 옛 화면은 API 401과 로그인 화면 새로 열기를 거쳐 모두 종료 화면으로 간다</title><defs><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#ECEAF7"/></marker></defs><rect x="0.75" y="0.75" width="758.5" height="290.5" rx="14" fill="#15141F" stroke="#34314A" stroke-width="1.5"/><rect x="20" y="30" width="160" height="58" rx="10" fill="#1E1C2C" stroke="#34314A" stroke-width="1.5"/><text x="100.0" y="64.0" fill="#ECEAF7" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">새로 여는 페이지</text><line x1="182" y1="59" x2="206" y2="59" stroke="#ECEAF7" stroke-width="1.6" marker-end="url(#arr-dark)"/><rect x="208" y="30" width="304" height="58" rx="10" fill="#2A2650" stroke="#8E83FF" stroke-width="1.5"/><text x="360.0" y="64.0" fill="#ECEAF7" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Proxy가 서버 시계로 판단</text><line x1="514" y1="59" x2="538" y2="59" stroke="#ECEAF7" stroke-width="1.6" marker-end="url(#arr-dark)"/><rect x="540" y="30" width="200" height="58" rx="10" fill="#173329" stroke="#4CC99A" stroke-width="1.5"/><text x="640.0" y="64.0" fill="#ECEAF7" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">어느 주소든 /ended로</text><rect x="20" y="104" width="160" height="58" rx="10" fill="#1E1C2C" stroke="#34314A" stroke-width="1.5"/><text x="100.0" y="138.0" fill="#ECEAF7" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">열려 있는 화면</text><line x1="182" y1="133" x2="206" y2="133" stroke="#ECEAF7" stroke-width="1.6" marker-end="url(#arr-dark)"/><rect x="208" y="104" width="304" height="58" rx="10" fill="#2A2650" stroke="#8E83FF" stroke-width="1.5"/><text x="360.0" y="138.0" fill="#ECEAF7" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">서버가 알려 준 남은 시간만큼 기다림</text><line x1="514" y1="133" x2="538" y2="133" stroke="#ECEAF7" stroke-width="1.6" marker-end="url(#arr-dark)"/><rect x="540" y="104" width="200" height="58" rx="10" fill="#173329" stroke="#4CC99A" stroke-width="1.5"/><text x="640.0" y="138.0" fill="#ECEAF7" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">정각 1초 뒤 /ended로</text><rect x="20" y="178" width="160" height="58" rx="10" fill="#1E1C2C" stroke="#34314A" stroke-width="1.5"/><text x="100.0" y="212.0" fill="#ECEAF7" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">배포 전에 연 옛 화면</text><line x1="182" y1="207" x2="206" y2="207" stroke="#ECEAF7" stroke-width="1.6" marker-end="url(#arr-dark)"/><rect x="208" y="178" width="304" height="58" rx="10" fill="#2A2650" stroke="#8E83FF" stroke-width="1.5"/><text x="360.0" y="212.0" fill="#ECEAF7" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">API 401 → 옛 코드가 /login을 새로 엶</text><line x1="514" y1="207" x2="538" y2="207" stroke="#ECEAF7" stroke-width="1.6" marker-end="url(#arr-dark)"/><rect x="540" y="178" width="200" height="58" rx="10" fill="#173329" stroke="#4CC99A" stroke-width="1.5"/><text x="640.0" y="212.0" fill="#ECEAF7" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Proxy가 /ended로 바꿈</text><text x="380" y="272" fill="#A5A1C0" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">휴대폰 시계는 쓰지 않는다 — 빠르면 운영 중에 넘어가고, 느리면 종료 뒤에도 남는다</text></svg>